<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:xlink="http://www.w3.org/1999/xlink">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta charset="utf-8" />
    <title>ScratchJr Player</title>
    <script src="./js/jquery.min.js"></script>
    <script src="./js/common.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #player-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 18px;
        transition: opacity 0.3s;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        border-top-color: #f7a827;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #player-error-msg {
        color: #ff6b6b;
        margin-top: 10px;
        font-size: 14px;
        max-width: 80%;
        text-align: center;
      }
    </style>
    <script>
      window.scratchJrPage = "editor";

      // URLパラメータ取得
      function getParam(key) {
        if (window.urlParams) {
          return window.urlParams(key);
        }
        var match = RegExp("[?&]" + key + "=([^&]*)").exec(window.location.search);
        return match && decodeURIComponent(match[1].replace(/\+/g, " "));
      }

      function updateStatus(text) {
        var el = document.getElementById("player-loading-text");
        if (el) el.innerText = text;
      }

      function hideLoading() {
        var overlay = document.getElementById("player-loading-overlay");
        if (overlay) {
          overlay.style.opacity = "0";
          setTimeout(function() {
            overlay.style.display = "none";
          }, 300);
        }
        var bd = document.getElementById("backdrop");
        if (bd) {
          bd.style.display = "none";
          bd.className = "modal-backdrop fade";
        }
        var md = document.getElementById("modaldialog");
        if (md) {
          md.style.display = "none";
          md.className = "modal fade";
        }
        if (window.ScratchJr) {
          window.ScratchJr.onHold = false;
        }
      }

      function showError(msg) {
        var spinner = document.querySelector(".spinner");
        if (spinner) spinner.style.display = "none";
        var txt = document.getElementById("player-loading-text");
        if (txt) txt.innerText = "プロジェクトの読み込みに失敗しました";
        var err = document.getElementById("player-error-msg");
        if (err) err.innerText = msg;
      }

      // ScratchJr の基本初期化が完了するのを待機
      function waitUntilScratchJrReady(callback) {
        var checkCount = 0;
        var interval = setInterval(function() {
          checkCount++;
          if (window.ScratchJr && window.ScratchJr.loadProjectSjr && window.ScratchJr.stage) {
            clearInterval(interval);
            callback();
          } else if (checkCount > 100) { // 15秒以上
            clearInterval(interval);
            showError("ScratchJr エンジンの初期化がタイムアウトしました。");
          }
        }, 150);
      }

      // プロジェクトデータの展開・ステージ準備が完了するのを待機
      function waitForProjectReady(callback) {
        if (window.ScratchJr && window.ScratchJr.isProjectLoaded) {
          callback();
          return;
        }
        var called = false;
        var done = function() {
          if (called) return;
          called = true;
          window.removeEventListener("projectLoaded", done);
          callback();
        };
        window.addEventListener("projectLoaded", done);

        var checkCount = 0;
        var interval = setInterval(function() {
          checkCount++;
          if (window.ScratchJr && window.ScratchJr.isProjectLoaded) {
            clearInterval(interval);
            done();
          } else if (checkCount > 60) { // 9秒以上
            clearInterval(interval);
            done();
          }
        }, 150);
      }

      // Base64 から .sjr (ZIP) をロードして ScratchJr ランタイムへ渡す
      function loadSjrFromBase64(base64Data, autoPlay) {
        try {
          updateStatus("プロジェクトを展開中...");
          var binaryString = atob(base64Data);
          var len = binaryString.length;
          var bytes = new Uint8Array(len);
          for (var i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          var blob = new Blob([bytes], { type: "application/zip" });
          var blobUrl = URL.createObjectURL(blob);

          waitUntilScratchJrReady(function() {
            updateStatus("プロジェクトを読み込んでいます...");
            window.ScratchJr.loadProjectSjr(blobUrl, function(success) {
              if (success === false) {
                showError("プロジェクトの解凍または読み込みに失敗しました。");
                return;
              }
              waitForProjectReady(function() {
                hideLoading();
                if (autoPlay) {
                  setTimeout(function() {
                    startAutoPlay();
                  }, 400);
                }
              });
            });
          });
        } catch (e) {
          console.error(e);
          showError(e.message);
        }
      }

      // 直接 URL (Blob または外部URL) からロード
      function loadSjrFromUrl(url, autoPlay) {
        updateStatus("プロジェクトをダウンロード中...");
        waitUntilScratchJrReady(function() {
          window.ScratchJr.loadProjectSjr(url, function(success) {
            if (success === false) {
              showError("プロジェクトのダウンロードに失敗しました。");
              return;
            }
            waitForProjectReady(function() {
              hideLoading();
              if (autoPlay) {
                setTimeout(startAutoPlay, 400);
              }
            });
          });
        });
      }

      // 自動再生（全画面モード & 緑の旗スタート）
      function startAutoPlay(retryCount) {
        retryCount = retryCount || 0;
        try {
          if (!window.ScratchJr || !window.ScratchJr.stage || !window.ScratchJr.stage.currentPage) {
            if (retryCount < 20) {
              setTimeout(function() {
                startAutoPlay(retryCount + 1);
              }, 200);
            }
            return;
          }

          var fakeEvt = {
            preventDefault: function() {},
            stopPropagation: function() {}
          };

          // 全画面モードへ切り替え
          if (typeof window.ScratchJr.enterFullScreen === "function") {
            window.ScratchJr.enterFullScreen(fakeEvt);
          }

          // 緑の旗実行
          if (typeof window.ScratchJr.runStrips === "function") {
            window.ScratchJr.runStrips(fakeEvt);
          }
        } catch (err) {
          console.warn("Auto-play trigger exception:", err);
        }
      }

      // GAS Web API から JSONP で .sjr を取得する
      function fetchFromGas(gasUrl, fileId, autoPlay) {
        updateStatus("Google ドライブからプロジェクトを取得中...");
        var callbackName = "gasCallback_" + Date.now();
        window[callbackName] = function(response) {
          delete window[callbackName];
          if (response && response.success && response.data) {
            loadSjrFromBase64(response.data, autoPlay);
          } else {
            showError(response ? response.error : "空の応答が返されました");
          }
        };

        var script = document.createElement("script");
        var separator = gasUrl.indexOf("?") >= 0 ? "&" : "?";
        script.src = gasUrl + separator + "id=" + encodeURIComponent(fileId) + "&callback=" + callbackName;
        script.onerror = function() {
          showError("GAS API への接続に失敗しました。URLをご確認ください。");
        };
        document.head.appendChild(script);
      }

      // postMessage リスナー（親フレームや GAS からのメッセージ受け取り）
      var _loadedOnce = false;
      window.addEventListener("message", function(event) {
        try {
          var msg = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (msg && msg.type === "LOAD_SJR") {
            if (_loadedOnce) return;
            _loadedOnce = true;
            var autoPlay = msg.autoPlay !== undefined ? msg.autoPlay : true;
            if (msg.base64) {
              loadSjrFromBase64(msg.base64, autoPlay);
            } else if (msg.fileId && msg.gasUrl) {
              fetchFromGas(msg.gasUrl, msg.fileId, autoPlay);
            } else if (msg.fileUrl) {
              loadSjrFromUrl(msg.fileUrl, autoPlay);
            }
          }
        } catch (err) {
          console.warn("Message handle error:", err);
        }
      });

      // ページ読み込み完了時の処理
      window.addEventListener("DOMContentLoaded", function() {
        var fileId = getParam("id");
        var gasUrl = getParam("gas");
        var fileUrl = getParam("file");
        var autoPlay = getParam("autoPlay") !== "0";

        if (fileId && gasUrl) {
          fetchFromGas(gasUrl, fileId, autoPlay);
        } else if (fileUrl) {
          loadSjrFromUrl(fileUrl, autoPlay);
        } else {
          updateStatus("プロジェクトの受信を待機しています...");
          // 親フレームへ準備完了通知を送る（親が postMessage を再送できるように）
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: "PLAYER_READY" }, "*");
            }
          } catch (e) {}

          // パラメータも postMessage もない場合、5秒後にローディングを消す
          setTimeout(function() {
            var overlay = document.getElementById("player-loading-overlay");
            if (overlay && overlay.style.display !== "none") {
              var txt = document.getElementById("player-loading-text");
              if (txt && txt.innerText.indexOf("待機") > -1) {
                hideLoading();
              }
            }
          }, 5000);
        }
      });
    </script>
    <script type="text/javascript" src="app.bundle.js"></script>
  </head>
  <body style="background: white">
    <div id="player-loading-overlay">
      <div class="spinner"></div>
      <div id="player-loading-text">プレイヤーを初期化しています...</div>
      <div id="player-error-msg"></div>
    </div>
    <div class="frame" id="frame"></div>
    <div class="libframe" id="libframe"></div>
    <div class="paintframe" id="paintframe"></div>
  </body>
</html>
